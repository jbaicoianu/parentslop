<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#2a1810" />
  <title>Shared menu</title>
  <style>
    html, body { margin: 0; background: #0e0b12; color: #f4f1ea; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { min-height: 100vh; background: radial-gradient(ellipse at top, #2a1810, #0e0b12 55%); }
    main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
    footer { text-align: center; font-size: 0.75rem; color: #6f6a7c; padding: 0 16px 28px; }
  </style>
</head>
<body>
  <main><ps-shared-menu id="menu"></ps-shared-menu></main>
  <footer>Made with ParentSlop</footer>
  <script src="/tracker/components/ps-shared-menu.js"></script>
  <script>
    (function () {
      var token = decodeURIComponent((location.pathname.match(/^\/m\/([^/]+)/) || [])[1] || "");
      var el = document.getElementById("menu");
      el.setAttribute("token", token);
      // Keep the tab title in sync with the menu's title.
      var obs = new MutationObserver(function () {
        var h1 = el.shadowRoot && el.shadowRoot.querySelector("h1");
        if (h1) document.title = h1.textContent + " · Shared menu";
      });
      obs.observe(el.shadowRoot, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
